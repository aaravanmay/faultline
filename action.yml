name: "faultline — silent-failure gate"
description: "Deterministically catch your AI agent silently doing the wrong thing - and fail the PR before it ships. No LLM judge."
author: "faultline"
branding:
  icon: "alert-triangle"
  color: "orange"

inputs:
  suite:
    description: "Path to the Python suite file (defines faultline_suite() — or a mode function for probe/fuzz/scenarios/replay/mine)."
    required: false
    default: "faultline_suite.py"
  mode:
    description: "Which testing mode to run: run (chaos check), probe, fuzz, scenarios, replay, or mine."
    required: false
    default: "run"
  fail-on-silent:
    description: "Fail the build when a silent failure is detected. Set to 'false' for report-only mode."
    required: false
    default: "true"
  python-version:
    description: "Python version to run on."
    required: false
    default: "3.12"
  faultline-token:
    description: "Optional project token to push results to your hosted dashboard — store it in repo secrets. This is the ONLY variable needed for the hosted dashboard."
    required: false
    default: ""

outputs:
  verdict:
    description: "PASS or FAIL"
    value: ${{ steps.gate.outputs.verdict }}
  breaks:
    description: "Number of silent failures / broken checks detected"
    value: ${{ steps.gate.outputs.breaks }}
  checked:
    description: "Number of checks evaluated"
    value: ${{ steps.gate.outputs.checked }}

runs:
  using: "composite"
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
    - shell: bash
      run: pip install faultline
    - id: gate
      shell: bash
      env:
        FAULTLINE_TOKEN: ${{ inputs.faultline-token }}
      run: |
        set +e
        faultline "${{ inputs.mode }}" "${{ inputs.suite }}"
        code=$?
        set -e
        # exit-code semantics: 0 clean · 1 silent failure(s) · 2 usage/load error.
        # A usage error always fails — a misconfigured gate must never read green.
        if [ "$code" -ge 2 ]; then exit "$code"; fi
        if [ "$code" -eq 1 ] && [ "${{ inputs.fail-on-silent }}" = "true" ]; then exit 1; fi
        exit 0
